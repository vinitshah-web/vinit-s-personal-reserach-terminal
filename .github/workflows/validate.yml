name: Validate research terminal
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python scripts/ingest_real_archives.py
      - run: python -m pytest tests/ -q
      - run: python scripts/audit_snapshots.py
