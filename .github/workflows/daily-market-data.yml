name: Daily verified NSE market data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-market-data.yml"
  schedule:
    # 20:00 IST on weekdays, after TejHQ's documented 18:30 publication.
    - cron: "30 14 * * 1-5"
    # 22:00 IST retry, after the provider's documented 21:30 retry window.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nse-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build local security master
        run: |
          python -m alembic upgrade head
          python scripts/ingest_real_archives.py

      - name: Refresh and validate latest NSE snapshot
        id: market_refresh
        shell: bash
        run: |
          set +e
          refresh_output=$(python scripts/refresh_market_data.py --export-static 2>&1)
          refresh_exit=$?
          set -e
          printf '%s\n' "$refresh_output"
          if [ "$refresh_exit" -ne 0 ]; then
            annotation=$(printf '%s' "$refresh_output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Market data refresh failed::${annotation}"
            printf '%s' "$refresh_output" | python -c "import json,sys; from datetime import datetime,timezone; from pathlib import Path; Path('data/market_data_status.json').write_text(json.dumps({'status':'FAILED','attempted_at':datetime.now(timezone.utc).isoformat(),'error':sys.stdin.read()}, indent=2), encoding='utf-8')"
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changed static snapshot
        if: steps.market_refresh.outcome == 'success'
        run: |
          git add data/market_data_status.json
          if [ -f data/latest_quotes.json ]; then git add data/latest_quotes.json; fi
          if git diff --cached --quiet; then
            echo "Provider trading date is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_label=$(python -c "import json; d=json.load(open('data/market_data_status.json')); print(d.get('trading_date') or 'failed-attempt')")
          git commit -m "data: refresh NSE EOD snapshot for ${snapshot_label}"
          git push

      - name: Enforce successful market refresh
        if: always() && steps.market_refresh.outputs.success != 'true'
        run: exit 1
