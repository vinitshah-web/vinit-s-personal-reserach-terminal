name: Daily verified NSE market data

on:
  schedule:
    # 20:00 IST on weekdays, after TejHQ's documented 18:30 publication.
    - cron: "30 14 * * 1-5"
    # 22:00 IST retry, after the provider's documented 21:30 retry window.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nse-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Build local security master
        run: |
          python -m alembic upgrade head
          python scripts/ingest_real_archives.py

      - name: Refresh and validate latest NSE snapshot
        run: python scripts/refresh_market_data.py --export-static

      - name: Commit changed static snapshot
        run: |
          git add data/latest_quotes.json data/market_data_status.json
          if git diff --cached --quiet; then
            echo "Provider trading date is already published."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          trading_date=$(python -c "import json; print(json.load(open('data/market_data_status.json'))['trading_date'])")
          git commit -m "data: refresh NSE EOD snapshot for ${trading_date}"
          git push
