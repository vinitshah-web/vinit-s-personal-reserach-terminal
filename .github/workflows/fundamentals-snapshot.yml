name: Verified fundamentals snapshot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fundamentals-snapshot.yml"
      - "scripts/refresh_fundamentals.py"
      - "src/ingestion/fundamentals_snapshot.py"
      - "requirements.txt"
  schedule:
    # Saturday 21:30 IST. Fundamentals are event-driven, not daily market facts.
    - cron: "0 16 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamentals-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Probe batch fundamentals provider
        id: fundamentals_refresh
        shell: bash
        run: |
          set +e
          refresh_output=$(python scripts/refresh_fundamentals.py --limit 25 2>&1)
          refresh_exit=$?
          set -e
          printf '%s\n' "$refresh_output"
          if [ "$refresh_exit" -ne 0 ]; then
            printf '%s' "$refresh_output" | python -c "import json,sys; from datetime import datetime,timezone; from pathlib import Path; Path('data/fundamentals_status.json').write_text(json.dumps({'status':'FAILED','attempted_at':datetime.now(timezone.utc).isoformat(),'error':sys.stdin.read()}, indent=2), encoding='utf-8')"
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            python -c "import json; from pathlib import Path; d=json.load(open('data/fundamentals_snapshot.json')); Path('data/fundamentals_status.json').write_text(json.dumps({k:v for k,v in d.items() if k != 'data'}, indent=2), encoding='utf-8')"
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit provider result
        if: steps.fundamentals_refresh.outcome == 'success'
        run: |
          git add data/fundamentals_status.json
          if [ -f data/fundamentals_snapshot.json ]; then git add data/fundamentals_snapshot.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh fundamentals snapshot"
          git pull --rebase origin main
          git push

      - name: Enforce successful fundamentals refresh
        if: always() && steps.fundamentals_refresh.outputs.success != 'true'
        run: exit 1
