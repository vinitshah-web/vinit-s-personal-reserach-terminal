name: Daily fundamentals and company statements

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fundamentals-snapshot.yml"
      - "scripts/refresh_fundamentals.py"
      - "src/ingestion/fundamentals_snapshot.py"
      - "scripts/refresh_company_profiles.py"
      - "requirements.txt"
      - "data/securities_search_index.json"
  schedule:
    # 20:15 IST after market close; 22:15 IST retry, weekdays.
    - cron: "45 14 * * 1-5"
    - cron: "45 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamentals-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Refresh listed-company fundamentals
        id: fundamentals_refresh
        shell: bash
        run: |
          set +e
          refresh_output=$(python scripts/refresh_fundamentals.py --maximum-failure-rate 0.20 2>&1)
          refresh_exit=$?
          set -e
          printf '%s\n' "$refresh_output"
          if [ "$refresh_exit" -ne 0 ]; then
            printf '%s' "$refresh_output" | python -c "import json,sys; from datetime import datetime,timezone; from pathlib import Path; Path('data/fundamentals_status.json').write_text(json.dumps({'status':'FAILED','attempted_at':datetime.now(timezone.utc).isoformat(),'error':sys.stdin.read()}, indent=2), encoding='utf-8')"
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            python -c "import json; from pathlib import Path; d=json.load(open('data/fundamentals_snapshot.json')); Path('data/fundamentals_status.json').write_text(json.dumps({k:v for k,v in d.items() if k != 'data'}, indent=2), encoding='utf-8')"
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh all company profiles and annual statements
        id: company_refresh
        continue-on-error: true
        run: python scripts/refresh_company_profiles.py --refresh-all --limit 10000 --maximum-seconds 10800 --status-output data/company_profiles_status.json

      - name: Validate retained snapshot identities and prices
        run: python scripts/audit_snapshots.py

      - name: Commit provider result
        if: steps.fundamentals_refresh.outcome == 'success'
        run: |
          git add data/fundamentals_status.json data/dossier_cache
          if [ -f data/company_profiles_status.json ]; then git add data/company_profiles_status.json; fi
          if [ -f data/fundamentals_snapshot.json ]; then git add data/fundamentals_snapshot.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh fundamentals snapshot"
          git pull --rebase origin main
          git push

      - name: Enforce successful daily refresh
        if: always() && (steps.fundamentals_refresh.outputs.success != 'true' || steps.company_refresh.outcome == 'failure')
        run: exit 1
