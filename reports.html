<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Tear-Sheets — NSE Equity Research Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background-color: #fcfbf9; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .card { background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; box-shadow: 0 1px 3px 0 rgba(0,0,0,0.03); }
    .badge-slate { background-color: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
    .prose-custom h1 { font-size: 1.3rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }
    .prose-custom h2 { font-size: 1.1rem; font-weight: 700; color: #1e293b; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .prose-custom h3 { font-size: 0.95rem; font-weight: 600; color: #334155; margin-top: 1rem; margin-bottom: 0.25rem; }
    .prose-custom p { margin-bottom: 0.5rem; line-height: 1.5; font-size: 0.85rem; color: #334155; }
    .prose-custom ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; font-size: 0.85rem; color: #334155; }
    .prose-custom table { width: 100%; border-collapse: collapse; margin-top: 0.75rem; margin-bottom: 1rem; font-size: 0.8rem; font-family: ui-monospace, monospace; }
    .prose-custom th { border: 1px solid #cbd5e1; padding: 0.5rem 0.75rem; background: #f8fafc; color: #475569; text-align: left; }
    .prose-custom td { border: 1px solid #e2e8f0; padding: 0.5rem 0.75rem; color: #1e293b; }
    .prose-custom blockquote { border-left: 3px solid #059669; padding-left: 0.75rem; color: #475569; font-style: italic; background: #ecfdf5; padding-top: 0.25rem; padding-bottom: 0.25rem; }
    .prose-custom code { font-family: ui-monospace, monospace; background: #f1f5f9; padding: 0.15rem 0.35rem; border-radius: 4px; font-size: 0.8rem; color: #0f172a; }
    @media print {
      header, .no-print, button, input { display: none !important; }
      body { background: #fff !important; color: #000 !important; font-size: 10pt; }
      .card { border: none !important; box-shadow: none !important; }
      #reportContent { max-height: none !important; overflow: visible !important; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-6">
        <a href="index.html" class="flex items-center space-x-2">
          <div class="w-7 h-7 rounded-md bg-emerald-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">₹</div>
          <span class="font-bold tracking-tight text-slate-900 text-base">NSE Equity Research</span>
        </a>
        <nav class="hidden md:flex space-x-1 text-sm font-medium">
          <a href="index.html" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Home</a>
          <a href="research.html" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Research</a>
          <a href="compare.html" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Compare</a>
          <a href="watchlist.html" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Watchlist</a>
          <a href="reports.html" class="px-3 py-1.5 rounded-md text-emerald-800 bg-emerald-50 font-semibold">Reports</a>
        </nav>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="downloadActivePDF()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-semibold flex items-center space-x-1.5 shadow-sm transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Download PDF / Print</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col md:flex-row gap-6">
    <!-- Left Stocks Sidebar -->
    <div class="w-full md:w-80 card p-4 space-y-4 flex flex-col no-print">
      <div>
        <h2 class="text-sm font-bold uppercase tracking-wider text-slate-900">Research Universe</h2>
        <p class="text-[11px] text-slate-500 mt-0.5">Select a company tear-sheet to inspect</p>
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="Filter symbol or company..."
        class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs text-slate-900 focus:outline-none focus:ring-1 focus:ring-emerald-500 w-full"
        oninput="filterStocks()"
      />

      <div id="stocksList" class="flex-1 overflow-y-auto space-y-1.5 pr-1 max-h-[72vh]">
        <!-- Populated via JavaScript -->
      </div>
    </div>

    <!-- Right Report Viewer -->
    <div class="flex-1 card p-6 flex flex-col">
      <div class="flex items-center justify-between border-b border-slate-200 pb-3 mb-4 no-print">
        <div class="flex items-center space-x-3">
          <span id="activeTickerBadge" class="text-xs px-2.5 py-1 rounded bg-slate-100 text-slate-900 font-mono font-bold">RELIANCE</span>
          <span id="activeIsinBadge" class="text-xs text-slate-500 font-mono">INE002A01018</span>
        </div>
        <div class="flex items-center space-x-2">
          <button onclick="window.print()" class="px-3 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded text-xs font-medium transition">🖨️ Print</button>
        </div>
      </div>

      <div id="reportContent" class="prose-custom overflow-y-auto max-h-[75vh] pr-2">
        <div class="text-center py-12 text-slate-500">Loading research tear-sheet...</div>
      </div>
    </div>
  </main>

  <script>
    let STOCKS = [
      { ticker: "RELIANCE", name: "Reliance Industries Ltd", isin: "INE002A01018", tier: "Large-Cap", sector: "Energy & Retail" },
      { ticker: "TCS", name: "Tata Consultancy Services Ltd", isin: "INE467B01029", tier: "Large-Cap", sector: "IT Services" },
      { ticker: "HDFCBANK", name: "HDFC Bank Limited", isin: "INE040A01034", tier: "Large-Cap", sector: "Banking" },
      { ticker: "ETERNAL", name: "Eternal Limited (Zomato)", isin: "INE758T01015", tier: "Large-Cap", sector: "Consumer Cyclical" },
      { ticker: "INFY", name: "Infosys Limited", isin: "INE009A01021", tier: "Large-Cap", sector: "IT Services" },
      { ticker: "ICICIBANK", name: "ICICI Bank Limited", isin: "INE090A01021", tier: "Large-Cap", sector: "Banking" },
      { ticker: "BHARTIARTL", name: "Bharti Airtel Limited", isin: "INE397D01024", tier: "Large-Cap", sector: "Telecom" },
      { ticker: "ITC", name: "ITC Limited", isin: "INE154A01025", tier: "Large-Cap", sector: "FMCG" },
      { ticker: "LT", name: "Larsen & Toubro Ltd", isin: "INE018A01030", tier: "Large-Cap", sector: "Engineering" },
      { ticker: "SBIN", name: "State Bank of India", isin: "INE062A01020", tier: "Large-Cap", sector: "PSU Bank" },
      { ticker: "HINDUNILVR", name: "Hindustan Unilever Ltd", isin: "INE030A01027", tier: "Large-Cap", sector: "FMCG" },
      { ticker: "TRENT", name: "Trent Limited", isin: "INE849A01020", tier: "Mid-Cap", sector: "Retail" },
      { ticker: "DIXON", name: "Dixon Technologies Ltd", isin: "INE935N01020", tier: "Mid-Cap", sector: "Electronics" },
      { ticker: "PERSISTENT", name: "Persistent Systems Ltd", isin: "INE262H01021", tier: "Mid-Cap", sector: "IT Services" },
      { ticker: "POLYCAB", name: "Polycab India Limited", isin: "INE455K01017", tier: "Mid-Cap", sector: "Cables & Wires" },
      { ticker: "FEDERALBNK", name: "Federal Bank Limited", isin: "INE171A01029", tier: "Mid-Cap", sector: "Private Bank" }
    ].map(stock => ({...stock, exchange: 'NSE'}));

    const SYMBOL_ALIASES = {
      'ZOMATO': 'ETERNAL',
      'BLINKIT': 'ETERNAL',
      'PAYTM': 'ONE97',
      'L&T': 'LT'
    };

    const urlParams = new URLSearchParams(window.location.search);
    let initialTicker = (urlParams.get('ticker') || 'RELIANCE').trim().toUpperCase();
    if (SYMBOL_ALIASES[initialTicker]) initialTicker = SYMBOL_ALIASES[initialTicker];
    let currentTicker = initialTicker;
    let currentExchange = (urlParams.get('exchange') || 'NSE').toUpperCase() === 'BSE' ? 'BSE' : 'NSE';

    function renderStockList(items) {
      const container = document.getElementById('stocksList');
      container.innerHTML = "";
      items.slice(0, 200).forEach(st => {
        const isSelected = st.ticker === currentTicker && st.exchange === currentExchange;
        const div = document.createElement('div');
        div.className = `p-2.5 rounded-lg cursor-pointer transition border ${isSelected ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-slate-200 hover:border-slate-300'}`;
        div.onclick = () => selectTicker(st.ticker, st.exchange);
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-bold text-xs ${isSelected ? 'text-emerald-800' : 'text-slate-900'} font-mono">${st.ticker}</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded badge-slate">${st.exchange}</span>
          </div>
          <div class="text-[11px] text-slate-500 truncate mt-0.5">${st.name}</div>
          <div class="text-[10px] text-slate-400 font-mono mt-0.5">${st.isin} • ${st.sector}</div>
        `;
        container.appendChild(div);
      });
    }

    function filterStocks() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = STOCKS.filter(s => s.ticker.toLowerCase().includes(q) || s.name.toLowerCase().includes(q) || String(s.isin || '').toLowerCase().includes(q));
      renderStockList(filtered);
    }

    async function selectTicker(ticker, exchange = 'NSE') {
      currentTicker = SYMBOL_ALIASES[ticker] || ticker;
      currentExchange = exchange === 'BSE' ? 'BSE' : 'NSE';
      renderStockList(STOCKS);
      const st = STOCKS.find(s => s.ticker === currentTicker && s.exchange === currentExchange);
      if (st) {
        document.getElementById('activeTickerBadge').innerText = `${st.exchange}:${st.ticker}`;
        document.getElementById('activeIsinBadge').innerText = `${st.isin || 'ISIN unavailable'} • ${st.name}`;
      } else {
        document.getElementById('activeTickerBadge').innerText = `${currentExchange}:${currentTicker}`;
        document.getElementById('activeIsinBadge').innerText = currentTicker;
      }

      const contentEl = document.getElementById('reportContent');
      contentEl.innerHTML = '<div class="text-center py-12 text-slate-500">Fetching research tear-sheet...</div>';

      // 1. Try local API
      try {
        if (currentExchange !== 'NSE') throw new Error('Static exchange report');
        const res = await fetch(`/api/v1/reports/${encodeURIComponent(currentTicker)}`);
        if (res.ok) {
          const data = await res.json();
          contentEl.innerHTML = window.marked ? marked.parse(data.content_markdown) : data.content_markdown;
          return;
        }
      } catch (e) {}

      // 2. Static hosting fallback (e.g. GitHub Pages)
      const relPaths = currentExchange === 'NSE' ? [
        `reports/${encodeURIComponent(currentTicker)}_TEARSHEET.md`,
        `../../reports/${encodeURIComponent(currentTicker)}_TEARSHEET.md`
      ] : [];
      for (const relPath of relPaths) {
        try {
          const staticRes = await fetch(relPath);
          if (staticRes.ok) {
            const md = await staticRes.text();
            contentEl.innerHTML = window.marked ? marked.parse(md) : md;
            return;
          }
        } catch (err) {}
      }

      await renderSnapshotReport(contentEl, st);
    }

    async function renderSnapshotReport(contentEl, security) {
      try {
        const [quotesRes, fundamentalsRes, statusRes] = await Promise.all([
          fetch('data/latest_quotes.json', {cache: 'no-store'}),
          fetch('data/fundamentals_snapshot.json', {cache: 'no-store'}),
          fetch('data/market_data_status.json', {cache: 'no-store'})
        ]);
        if (![quotesRes, fundamentalsRes, statusRes].every(res => res.ok)) throw new Error('snapshot missing');
        const [quotes, fundamentalsPayload, status] = await Promise.all([quotesRes.json(), fundamentalsRes.json(), statusRes.json()]);
        const quote = quotes[currentExchange === 'BSE' ? `BSE:${currentTicker}` : currentTicker];
        const fact = (fundamentalsPayload.data || {})[`${currentExchange}:${currentTicker}`];
        const name = (security && security.name) || (fact && fact.company_name) || currentTicker;
        const unavailable = '<span class="text-slate-400">Unavailable from current sourced data</span>';
        contentEl.innerHTML = `
          <h1>${name} (${currentExchange}:${currentTicker})</h1>
          <p><b>Data policy:</b> This report contains sourced fields only. Missing facts remain unavailable.</p>
          <h2>Market snapshot</h2>
          <table><tbody>
            <tr><th>Verified close</th><td>${quote ? `₹${Number(quote.close).toLocaleString('en-IN', {minimumFractionDigits:2})}` : unavailable}</td></tr>
            <tr><th>Trading date</th><td>${quote ? quote.trade_date : unavailable}</td></tr>
            <tr><th>Price source</th><td>${quote ? quote.source : unavailable}</td></tr>
            <tr><th>Trailing P/E</th><td>${fact && fact.pe_ratio ? `${fact.pe_ratio}x` : unavailable}</td></tr>
            <tr><th>P/B</th><td>${fact && fact.pb_ratio ? `${fact.pb_ratio}x` : unavailable}</td></tr>
            <tr><th>P/B reason</th><td>${fact ? fact.pb_ratio_reason || unavailable : unavailable}</td></tr>
            <tr><th>Shares outstanding</th><td>${fact && fact.shares_outstanding_cr ? `${fact.shares_outstanding_cr} crore` : unavailable}</td></tr>
            <tr><th>52-week range</th><td>${fact && fact.fifty_two_week_low && fact.fifty_two_week_high ? `₹${fact.fifty_two_week_low} – ₹${fact.fifty_two_week_high}` : unavailable}</td></tr>
          </tbody></table>
          <h2>Company overview</h2>
          <p>${fact && fact.business_summary ? fact.business_summary : (fact && fact.business_summary_reason) || 'A verified company overview is unavailable.'}</p>
          <h2>Sources and limits</h2>
          <p>Price: ${quote ? quote.source : 'unavailable'}. Fundamentals: ${fact ? `${fact.source} (${fact.source_class}), retrieved ${fact.retrieved_at}` : 'unavailable'}. Financial statements and P/B require dated filing data and are not inferred.</p>
          <p><a href="research.html?ticker=${encodeURIComponent(currentTicker)}&exchange=${currentExchange}">Open the full research view →</a></p>`;
      } catch (error) {
        contentEl.innerHTML = '<div class="p-8 text-center text-slate-500">Verified snapshot files could not be loaded. No report was generated.</div>';
      }
    }

    async function downloadActivePDF() {
      // 1. Try local FastAPI PDF endpoint
      try {
        if (currentExchange !== 'NSE') throw new Error('Static print-to-PDF');
        const testRes = await fetch(`/api/v1/reports/${encodeURIComponent(currentTicker)}/pdf`, { method: 'HEAD' });
        if (testRes.ok) {
          window.location.href = `/api/v1/reports/${encodeURIComponent(currentTicker)}/pdf`;
          return;
        }
      } catch (e) {}

      // 2. Client-side print-to-PDF in static mode
      window.print();
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('data/securities_search_index.json', {cache: 'no-store'});
        if (response.ok) {
          const index = await response.json();
          STOCKS = index.map(item => ({
            ticker: item.ticker, name: item.name || item.ticker, isin: item.isin,
            tier: 'Listed', sector: item.sector || 'Unavailable', exchange: item.exchange || 'NSE'
          }));
        }
      } catch (error) {}
      renderStockList(STOCKS);
      selectTicker(currentTicker, currentExchange);
    });
  </script>
</body>
</html>
